version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: manipool-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/manipool
      - JWT_SECRET_KEY=production-secure-cpi-key-change-me
      - ADMIN_API_KEY=admin-reviewer-key-2026
      - DEV_MODE=false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: manipool-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manipool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
